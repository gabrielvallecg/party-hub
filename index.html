<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1014">
  <title>Party Hub</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    html { touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    body { background: #0f1014; }
    .hold { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
    .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
    .drain { animation: drain linear forwards; } @keyframes drain { from { width: var(--w); } to { width: 0; } }
    .pop { animation: pop .25s ease-out; } @keyframes pop { from { transform: scale(.92); opacity: .4; } }
  </style>
</head>
<body class="text-zinc-100 antialiased">
  <main id="app" class="max-w-md mx-auto min-h-dvh flex flex-col px-4 pt-[max(.5rem,env(safe-area-inset-top))]"></main>
  <script src="app.js"></script>
  <!-- Jogos: um arquivo por jogo -->
  <script src="games/impostor.js"></script>
  <script src="games/duplas-palavras.js"></script>
  <script src="games/duplas.js"></script>
  <script src="games/achedupla.js"></script>
  <script src="games/mimica.js"></script>
</body>
</html>
